[package]
name = "rust_mp3_editor"
version = "0.2.0"
edition = "2021"
description = "Pure Rust Native Audio Studio with real-time DSP, SoundCloud-style interactive waveform, and web audio extractor."

[dependencies]
eframe = "0.29"
egui = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
rfd = "0.15"
crossbeam-channel = "0.5"
uuid = { version = "1.10", features = ["v4"] }
